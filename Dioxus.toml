[application]

[bundle]
identifier = "no.lokander.hubro"
publisher = "Fredrik Lokander"
copyright = "Copyright © 2026 Fredrik Lokander"
category = "developer-tool"
short_description = "Desktop viewer for SQLite, Postgres, and SQL Server databases."
long_description = """
Hubro is a desktop database viewer for SQLite, Postgres, and SQL Server.
Browse tables and schemas, run SQL with an editor that offers schema-aware
completion, page through large result sets, edit rows inline, and export query
results — all from a native desktop app.
"""
# ORDER IS LOAD-BEARING — largest first (FRE-65). The macOS .icns is built
# entirely from the *first* entry: dx fills all twelve icns slots (up to
# 1024px) by Lanczos-resizing it, skipping any slot already occupied, so
# later entries are decoded and discarded. Listing 32x32 first therefore
# upscales a 32px image across the whole Dock/Finder icon set. Linux is
# unaffected either way — it routes each PNG by its decoded dimensions.
icon = [
    "assets/icons/512x512.png",
    "assets/icons/256x256.png",
    "assets/icons/128x128.png",
    "assets/icons/64x64.png",
    "assets/icons/32x32.png",
]

# File associations (FRE-114). Each platform declares them its own way, and
# `tests/file_associations.rs` checks every declaration against
# `cli::DATABASE_EXTENSIONS` and against the values in this file. What each one
# does, and why Linux's looks different from the other two, is in
# packaging/README.md.

[bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0"]
# dx renders this template for the deb, the rpm *and* the AppImage, so this one
# file is the whole Linux story: `Exec=… %f` plus the MimeType line.
desktop_template = "packaging/linux/hubro.desktop.hbs"
# Rebuild the desktop database, without which the MimeType line is not
# consulted until something else triggers a rebuild.
post_install_script = "packaging/linux/postinst"
post_remove_script = "packaging/linux/postrm"

# Release dmgs are built on Apple Silicon runners (arm64-only, no Intel
# build), and every arm64 Mac runs macOS 11+. Unsigned: no Developer ID, so
# first launch needs right-click → Open (documented in the README).
[bundle.macos]
minimum_system_version = "11.0"
# CFBundleDocumentTypes lives here because a macOS file association has nowhere
# else to go. Note this **replaces** dx's generated Info.plist rather than
# merging into it, so that file mirrors every key dx would have written — read
# its header before touching it.
info_plist_path = "packaging/macos/Info.plist"

# WebView2 install mode for the Windows installers: the evergreen download
# bootstrapper keeps them small (the offline installer would embed ~130 MB).
# Windows 11 and updated Windows 10 already ship the runtime; a clean machine
# fetches it during install, which needs internet access. Installers are
# unsigned (FRE-49: no Authenticode cert), so SmartScreen shows an "unknown
# publisher" warning on first run — documented in the README.
[bundle.windows]
webview_install_mode = { DownloadBootstrapper = { silent = true } }
# Required for the executable and MSI to carry our icon at all (FRE-65): dx
# only reads `.ico` entries when embedding Windows resources, and every path
# in `bundle.icon` above is a `.png`. Without this it silently falls back to
# dx's own bundled logo.
icon_path = "assets/icons/icon.ico"

# Registry entries registering hubro as *an* "Open with" handler for database
# files. MSI only: the NSIS setup.exe installs no associations, which is a
# deliberate limit of this issue rather than an oversight.
[bundle.windows.wix]
fragment_paths = ["packaging/windows/file-associations.wxs"]
# The fragment is dead weight without this — it defines the component group,
# and only a reference from the installed feature pulls it in.
component_group_refs = ["HubroFileAssociations"]
