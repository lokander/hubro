[application]

[bundle]
identifier = "no.lokander.dataview"
publisher = "Fredrik Lokander"
copyright = "Copyright © 2026 Fredrik Lokander"
category = "developer-tool"
short_description = "Desktop viewer for SQLite and Postgres databases."
long_description = """
dataview is a desktop database viewer for SQLite and Postgres. Browse tables and
schemas, run SQL with an editor that offers schema-aware completion, page through
large result sets, edit rows inline, and export query results — all from a native
desktop app.
"""
icon = [
    "assets/icons/32x32.png",
    "assets/icons/64x64.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
]

[bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0"]
