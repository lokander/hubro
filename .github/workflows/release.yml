name: Release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"

# Default to read-only; only the publish job gets the write scope
# softprops/action-gh-release needs to create the release and upload assets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Match the dx CLI version to the `dioxus` version Cargo.lock resolves to
  # (Cargo.toml requests ^0.7.1; the lockfile pins 0.7.9).
  DX_VERSION: "0.7.9"

jobs:
  linux:
    name: Bundle Linux (deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same desktop libraries as CI, plus the AppImage tooling deps: FUSE for
      # appimagetool and file/desktop-file utilities it shells out to.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libfuse2t64 \
            desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # binstall grabs a prebuilt dx binary instead of compiling the CLI from
      # source (which would add many minutes to every release). --force because
      # a warm rust-cache can restore .crates.toml metadata claiming dx is
      # installed while the binary is absent (observed on the v0.6.1 re-run) —
      # a plain binstall then no-ops and Bundle dies with dx not found.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.19

      - name: Install Dioxus CLI
        run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}

      # appimagetool needs FUSE; extract-and-run avoids mounting on runners
      # where FUSE is flaky.
      - name: Bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dx bundle --release --package-types deb --package-types appimage --out-dir dist

      # dx nests bundles under dist/bundle/<type>/; flatten to a predictable dir.
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: Bundle macOS (dmg)
    # Apple Silicon runner → arm64-only dmg (no Intel build). Unsigned per
    # FRE-48: no Developer ID, so Gatekeeper blocks the first launch (the
    # README documents the xattr / Open Anyway workaround).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.19

      # --force for the same warm-cache reason as the linux job.
      - name: Install Dioxus CLI
        run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}

      # `macos` produces the .app the dmg wraps; the .dmg is the artifact we
      # ship (an .app is a directory, so it can't be a release asset as-is).
      - name: Bundle
        run: dx bundle --release --package-types macos --package-types dmg --out-dir dist

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -type f -name '*.dmg' -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Bundle Windows (msi + nsis)
    # x64-only. Unsigned per FRE-49: no Authenticode cert, so SmartScreen
    # shows an "unknown publisher" warning on first run (the README documents
    # More info → Run anyway). WiX (msi) and NSIS (setup exe) are downloaded
    # by the bundler on demand; NASM (needed by aws-lc-sys) is preinstalled
    # on windows-latest images.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # No binstall here: its action broke on the windows runner (first real
      # run of this job, v0.6.1) while working on linux/macos. The Dioxus
      # release ships a prebuilt Windows dx, so download that directly —
      # deterministic and one less third-party action.
      - name: Install Dioxus CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${env:DX_VERSION}" --repo DioxusLabs/dioxus --pattern 'dx-x86_64-pc-windows-msvc.zip' --dir $env:TEMP
          Expand-Archive "$env:TEMP\dx-x86_64-pc-windows-msvc.zip" -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
          dx --version

      - name: Bundle
        run: dx bundle --release --package-types msi --package-types nsis --out-dir dist

      # The nsis installer is named *-setup.exe; a bare *.exe glob would also
      # sweep up the unbundled app binary dx drops in the out dir.
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Name -like '*.msi' -or $_.Name -like '*-setup.exe' } |
            Copy-Item -Destination artifacts
          Get-ChildItem artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: artifacts/*
          if-no-files-found: error

  # Single fan-in publish: jobs creating the same release concurrently
  # race in softprops/action-gh-release, so only this job touches the release.
  publish:
    name: Publish release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
