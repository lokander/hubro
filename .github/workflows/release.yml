name: Release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"
  # Escape hatch for an existing tag. A tag pushed while Actions is disabled
  # (e.g. the monthly minutes ran out) never produces a run, and deleting and
  # re-pushing that same tag afterwards does not reliably create one either —
  # observed on v0.7.0, where GitHub logged the deletes but no create. Build
  # and publish it by hand instead:
  #   gh workflow run release.yml --ref main -f tag=v0.7.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.7.0"
        required: true
        type: string

# Default to read-only; only the publish job gets the write scope
# softprops/action-gh-release needs to create the release and upload assets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Match the dx CLI version to the `dioxus` version Cargo.lock resolves to
  # (Cargo.toml requests ^0.7.1; the lockfile pins 0.7.9).
  DX_VERSION: "0.7.9"

jobs:
  # The tag names the release and every download link, but nothing downstream
  # reads it: `dx bundle` stamps the Linux and Windows artifacts from
  # Cargo.toml, and the macOS bundle from packaging/macos/Info.plist, which dx
  # uses *instead of* the plist it would generate. All three can disagree with
  # the tag and still build and publish. v0.6.0 shipped that way — its tag
  # names a commit whose Cargo.toml still said 0.5.0.
  #
  # tests/file_associations.rs pins the plist to Cargo.toml, but it only runs
  # in ci.yml on a push to main; a tag cut from a stale checkout never meets
  # it. This needs no build, so it costs seconds and gates the bundle jobs.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The tag arrives via env rather than `${{ }}` inside the script: a
      # workflow_dispatch input is attacker-controlled text as far as the shell
      # is concerned, and interpolating it directly would splice it into the
      # command.
      - name: Tag, Cargo.toml and Info.plist agree
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import re, sys, tomllib

          tag = sys.argv[1]
          expected = tag[1:] if tag.startswith("v") else tag

          # Scan for the key and take the string after it, the way
          # tests/file_associations.rs does. Not a plist parser: the file's
          # header comment contains `--package-types`, and `--` inside an XML
          # comment is malformed XML, so a strict parser (plistlib) rejects a
          # file that macOS itself accepts.
          def plist_string(key):
              text = open("packaging/macos/Info.plist", encoding="utf-8").read()
              _, marker, after = text.partition(f"<key>{key}</key>")
              if not marker:
                  sys.exit(f"Info.plist has no <key>{key}</key>")
              match = re.search(r"<string>(.*?)</string>", after, re.S)
              if not match:
                  sys.exit(f"{key} is not followed by a string value")
              return match.group(1).strip()

          with open("Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)["package"]["version"]

          found = {
              "Cargo.toml version": cargo,
              "Info.plist CFBundleShortVersionString": plist_string("CFBundleShortVersionString"),
              "Info.plist CFBundleVersion": plist_string("CFBundleVersion"),
          }

          print(f"tag {tag} -> expecting version {expected}")
          for where, value in found.items():
              print(f"  {where}: {value}")

          wrong = [w for w, v in found.items() if v != expected]
          for where in wrong:
              print(f"::error::{where} is {found[where]}, but tag {tag} expects {expected}")
          sys.exit(1 if wrong else 0)
          PY

  linux:
    name: Bundle Linux (deb + AppImage)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # On a dispatch run, build the tag named in the input rather than the
      # branch the run was started from; on a tag push, `inputs.tag` is empty
      # and this is the tag ref as usual.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Same desktop libraries as CI, plus the AppImage tooling deps: FUSE for
      # appimagetool and file/desktop-file utilities it shells out to.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libfuse2t64 \
            desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # binstall grabs a prebuilt dx binary instead of compiling the CLI from
      # source (which would add many minutes to every release). --force because
      # a warm rust-cache can restore .crates.toml metadata claiming dx is
      # installed while the binary is absent (observed on the v0.6.1 re-run) —
      # a plain binstall then no-ops and Bundle dies with dx not found.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.19

      - name: Install Dioxus CLI
        run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}

      # appimagetool needs FUSE; extract-and-run avoids mounting on runners
      # where FUSE is flaky.
      - name: Bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dx bundle --release --package-types deb --package-types appimage --out-dir dist

      # dx nests bundles under dist/bundle/<type>/; flatten to a predictable dir.
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: Bundle macOS (dmg)
    needs: verify
    # Apple Silicon runner → arm64-only dmg (no Intel build). Unsigned per
    # FRE-48: no Developer ID, so Gatekeeper blocks the first launch (the
    # README documents the xattr / Open Anyway workaround).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.19

      # --force for the same warm-cache reason as the linux job.
      - name: Install Dioxus CLI
        run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}

      # `macos` produces the .app the dmg wraps; the .dmg is the artifact we
      # ship (an .app is a directory, so it can't be a release asset as-is).
      - name: Bundle
        run: dx bundle --release --package-types macos --package-types dmg --out-dir dist

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -type f -name '*.dmg' -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Bundle Windows (msi + nsis)
    needs: verify
    # x64-only. Unsigned per FRE-49: no Authenticode cert, so SmartScreen
    # shows an "unknown publisher" warning on first run (the README documents
    # More info → Run anyway). WiX (msi) and NSIS (setup exe) are downloaded
    # by the bundler on demand; NASM (needed by aws-lc-sys) is preinstalled
    # on windows-latest images.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # No binstall here: its action broke on the windows runner (first real
      # run of this job, v0.6.1) while working on linux/macos. The Dioxus
      # release ships a prebuilt Windows dx, so download that directly —
      # deterministic and one less third-party action.
      - name: Install Dioxus CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${env:DX_VERSION}" --repo DioxusLabs/dioxus --pattern 'dx-x86_64-pc-windows-msvc.zip' --dir $env:TEMP
          Expand-Archive "$env:TEMP\dx-x86_64-pc-windows-msvc.zip" -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
          dx --version

      - name: Bundle
        run: dx bundle --release --package-types msi --package-types nsis --out-dir dist

      # The nsis installer is named *-setup.exe; a bare *.exe glob would also
      # sweep up the unbundled app binary dx drops in the out dir.
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Name -like '*.msi' -or $_.Name -like '*-setup.exe' } |
            Copy-Item -Destination artifacts
          Get-ChildItem artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: artifacts/*
          if-no-files-found: error

  # Single fan-in publish: jobs creating the same release concurrently
  # race in softprops/action-gh-release, so only this job touches the release.
  publish:
    name: Publish release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # `github.ref_name` is the tag on a push run and the dispatch branch
          # otherwise, so a dispatch has to name the tag explicitly.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
