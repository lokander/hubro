name: Release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"

# Needed for softprops/action-gh-release to create the release and upload assets.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Match the dx CLI version to the `dioxus` version Cargo.lock resolves to
  # (Cargo.toml requests ^0.7.1; the lockfile pins 0.7.9).
  DX_VERSION: "0.7.9"

jobs:
  linux:
    name: Bundle Linux (deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same desktop libraries as CI, plus the AppImage tooling deps: FUSE for
      # appimagetool and file/desktop-file utilities it shells out to.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libfuse2t64 \
            desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # binstall grabs a prebuilt dx binary instead of compiling the CLI from
      # source (which would add many minutes to every release).
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.19

      - name: Install Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}

      # appimagetool needs FUSE; extract-and-run avoids mounting on runners
      # where FUSE is flaky.
      - name: Bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dx bundle --release --package-types deb --package-types appimage --out-dir dist

      # dx nests bundles under dist/bundle/<type>/; flatten to a predictable dir.
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/*

  macos:
    name: Bundle macOS (dmg)
    # Apple Silicon runner → arm64-only dmg (no Intel build). Unsigned per
    # FRE-48: no Developer ID, so Gatekeeper needs right-click → Open on
    # first launch (documented in the README and release notes).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.19

      - name: Install Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}

      # `macos` produces the .app the dmg wraps; the .dmg is the artifact we
      # ship (an .app is a directory, so it can't be a release asset as-is).
      - name: Bundle
        run: dx bundle --release --package-types macos --package-types dmg --out-dir dist

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find dist -type f -name '*.dmg' -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: artifacts/*

  # Single fan-in publish: two jobs creating the same release concurrently
  # race in softprops/action-gh-release, so only this job touches the release.
  publish:
    name: Publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
