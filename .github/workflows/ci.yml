name: CI

# Changes that can't affect a build or a test never start one — and that is a
# short list, because the tests read far more than code. tests/no_issue_ids.rs
# scans every tracked text file, tests/support_matrix.rs reads README.md, and
# tests/file_associations.rs walks packaging/, README included. So no text file
# is ignored, docs and CLAUDE.md included: a docs-only commit straight to main
# is exactly the change those tests exist to check, and `**/*.md` used to let
# it land with no run at all. What is left is binary art only `dx bundle`
# reads, which CI doesn't run. Not every .ico: assets/favicon.ico goes through
# `asset!()`, so it is a compile input. tests/ci_workflow.rs checks each
# pattern below against what git tracks and what the code names.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.png"
      - "**/*.xcf"
      - "assets/icons/*.ico"
  pull_request:
    paths-ignore:
      - "**/*.png"
      - "**/*.xcf"
      - "assets/icons/*.ico"
  # Escape hatch for a PR that touches platform-specific code: run the full
  # matrix on its branch with `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is a large share of both link time and target/ size, and CI
  # never opens a debugger — dropping it shortens the build and shrinks the
  # cache the runners push and pull each run (the Windows leg's two biggest
  # costs). `dev` covers the lib and its dependencies, `test` the test
  # binaries. Trade-off: a failing test's backtrace loses line numbers; set
  # these to "line-tables-only" instead if that ever gets in the way.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    # Pull requests check Linux only; every push to main (and a manual
    # dispatch) checks all three desktop platforms. Tags are left out because
    # release.yml already builds each OS. Keeping macOS and Windows off the PR
    # path is what holds this repo inside the monthly Actions minutes — the
    # cost is that platform-specific breakage surfaces after the merge, so
    # dispatch the full matrix on the branch (see the workflow_dispatch note
    # above) when a PR touches anything platform-shaped:
    #
    #   - `cfg(windows)`/`cfg(unix)` code;
    #   - path *syntax* — separators, drive letters, UNC, absolute-ness,
    #     canonicalisation, or a `file://` URL (`Url::to_file_path` applies
    #     each platform's rules, so one assertion cannot describe all three).
    #     Not merely handling a path: nearly every PR here does that, and a
    #     trigger that fires on all of them is one nobody can follow;
    #   - a test comparing a checked-in file byte for byte, or matching one
    #     against a literal containing `\n` (see .gitattributes);
    #   - process spawning, signals, or the keyring.
    #
    # The `cfg` bullet alone used to be the whole rule and was too narrow:
    # one batch of three Windows failures across two merged PRs had no `cfg`
    # block at all — a path, a `file://` URL, and two byte-exact
    # comparisons.
    # fail-fast off: when one leg fails, the others still report, so
    # platform-specific breakage is diagnosed in a single run.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A Postgres for the engine suites, so the Linux leg runs them instead of
      # skipping them: db_postgres and the shared suites (db_ddl, db_script,
      # db_staged, …) all read HUBRO_PG_TEST_URL. Started first so it boots
      # while cargo compiles. The same image and credentials as
      # tests/db_postgres.rs's header and scripts/test-db.sh set 0. A plain
      # `docker run` rather than `services:`, which fails a job outright on
      # macOS and Windows runners and would take this matrix's other legs
      # with it. HUBRO_REQUIRE_TEST_URLS makes a lost variable a failure
      # rather than ~70 silent skips (tests/common/mod.rs).
      - name: Start Postgres
        if: runner.os == 'Linux'
        run: |
          docker run -d --name hubro-pg-test -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_USER=tester -e POSTGRES_DB=demo -p 5433:5432 \
            postgres:17-alpine
          echo "HUBRO_PG_TEST_URL=postgres://tester:testpass@localhost:5433/demo" >> "$GITHUB_ENV"
          echo "HUBRO_REQUIRE_TEST_URLS=HUBRO_PG_TEST_URL" >> "$GITHUB_ENV"

      # System libraries the Dioxus desktop build (wry/WebKitGTK), the tray
      # icon, and the native file dialog link against. The committed
      # assets/tailwind.css and assets/codemirror.js mean no Node/Tailwind
      # toolchain is needed — a plain `cargo` build suffices. macOS
      # (WKWebView) and Windows (WebView2) need no extra system packages.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and ./target keyed on the lockfile + toolchain.
      # cache-on-failure: a leg that fails mid-compile (slow on Windows)
      # still saves its dependency builds so the retry starts warm.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Formatting is platform-independent — checking it once is enough.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Run from the repo root so clippy.toml (the await-holding-invalid-types
      # rule) applies. Deny warnings so lint regressions fail the build.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Over TCP on purpose: the image's entrypoint runs a socket-only
      # server while it initialises and then restarts it, so a socket probe
      # can answer ready just before the real server goes down and back up.
      - name: Wait for Postgres
        if: runner.os == 'Linux'
        run: |
          for _ in $(seq 60); do
            docker exec hubro-pg-test pg_isready -h 127.0.0.1 -U tester -d demo && exit 0
            sleep 2
          done
          docker logs hubro-pg-test
          exit 1

      # Builds every target and runs the fast suite. On Linux the Postgres
      # suites run against the container above; every other engine, the SSH
      # tunnel tests, and Postgres on macOS and Windows skip because their env
      # vars are unset (no server there); the large-fixture perf tests are
      # `#[ignore]`d.
      - name: Test
        run: cargo test --all-targets
