name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System libraries the Dioxus desktop build (wry/WebKitGTK), the tray
      # icon, and the native file dialog link against. The committed
      # assets/tailwind.css and assets/codemirror.js mean no Node/Tailwind
      # toolchain is needed — a plain `cargo` build suffices.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and ./target keyed on the lockfile + toolchain.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # Run from the repo root so clippy.toml (the await-holding-invalid-types
      # rule) applies. Deny warnings so lint regressions fail the build.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Builds every target and runs the fast suite. The Postgres/SSH
      # integration tests skip when their env vars are unset (no server in
      # CI); the large-fixture perf tests are `#[ignore]`d.
      - name: Test
        run: cargo test --all-targets
