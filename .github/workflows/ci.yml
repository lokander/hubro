name: CI

# Changes that can't affect a build or a test never start one — and that is a
# short list, because the tests read far more than code. tests/no_issue_ids.rs
# scans every tracked text file, tests/support_matrix.rs reads README.md, and
# tests/file_associations.rs walks packaging/, README included. So no text file
# is ignored, docs and CLAUDE.md included: a docs-only commit straight to main
# is exactly the change those tests exist to check, and `**/*.md` used to let
# it land with no run at all. What is left is binary art only `dx bundle`
# reads, which CI doesn't run. Not every .ico: assets/favicon.ico goes through
# `asset!()`, so it is a compile input. tests/ci_workflow.rs checks each
# pattern below against what git tracks and what the code names.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.png"
      - "**/*.xcf"
      - "assets/icons/*.ico"
  pull_request:
    paths-ignore:
      - "**/*.png"
      - "**/*.xcf"
      - "assets/icons/*.ico"
  # Runs the full matrix on a branch that has no pull request:
  # `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is a large share of both link time and target/ size, and CI
  # never opens a debugger — dropping it shortens the build and shrinks the
  # cache the runners push and pull each run (the Windows leg's two biggest
  # costs). `dev` covers the lib and its dependencies, `test` the test
  # binaries. Trade-off: a failing test's backtrace loses line numbers; set
  # these to "line-tables-only" instead if that ever gets in the way.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    # Every trigger runs all three desktop platforms: pull requests, pushes
    # to main and a manual dispatch. Tags are left out because release.yml
    # already builds each OS. The repository is public, so GitHub's standard
    # hosted runners cost no Actions minutes on any OS — the reason pull
    # requests used to check Linux only (a monthly minutes budget) does not
    # apply, and keeping macOS and Windows off them only meant that
    # platform-specific breakage surfaced after the merge. One batch of three
    # Windows failures across two merged PRs did exactly that, with no `cfg`
    # block anywhere in the change: a path, a `file://` URL, and two
    # byte-exact comparisons of checked-in files.
    #
    # fail-fast off: when one leg fails, the others still report, so
    # platform-specific breakage is diagnosed in a single run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Two Postgres servers for the engine suites, so the Linux leg runs them
      # instead of skipping them: db_postgres and the shared suites (db_ddl,
      # db_script, db_staged, …) all read HUBRO_PG_TEST_URL. Started first so
      # they boot while cargo compiles.
      #
      # 17 is the suites' documented server — the same image and credentials
      # as tests/db_postgres.rs's header and scripts/test-db.sh set 0 — and
      # the main Test step runs against it. 18 gets a second pass of the same
      # suites below, because some behaviour only exists there: a bare
      # GENERATED ALWAYS AS (…) is VIRTUAL from 18 on, and on 17
      # tests/db_ddl.rs can check only the STORED half, so a regression
      # rendering VIRTUAL as STORED would pass a 17-only CI.
      #
      # Plain `docker run` rather than `services:`, which fails a job outright
      # on macOS and Windows runners and would take this matrix's other legs
      # with it. HUBRO_REQUIRE_TEST_URLS makes a lost URL a failure rather
      # than ~70 silent skips, and HUBRO_PG_TEST_MAJOR makes a URL reaching
      # the wrong server one (both in tests/common/mod.rs). The 18 pass
      # overrides the URL and the major on its own command line.
      - name: Start Postgres
        if: runner.os == 'Linux'
        run: |
          docker run -d --name hubro-pg-test -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_USER=tester -e POSTGRES_DB=demo -p 5433:5432 \
            postgres:17-alpine
          docker run -d --name hubro-pg18-test -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_USER=tester -e POSTGRES_DB=demo -p 5418:5432 \
            postgres:18-alpine
          echo "HUBRO_PG_TEST_URL=postgres://tester:testpass@localhost:5433/demo" >> "$GITHUB_ENV"
          echo "HUBRO_PG_TEST_MAJOR=17" >> "$GITHUB_ENV"
          echo "PG18_URL=postgres://tester:testpass@localhost:5418/demo" >> "$GITHUB_ENV"
          echo "HUBRO_REQUIRE_TEST_URLS=HUBRO_PG_TEST_URL" >> "$GITHUB_ENV"

      # System libraries the Dioxus desktop build (wry/WebKitGTK), the tray
      # icon, and the native file dialog link against. The committed
      # assets/tailwind.css and assets/codemirror.js mean no Node/Tailwind
      # toolchain is needed — a plain `cargo` build suffices. macOS
      # (WKWebView) and Windows (WebView2) need no extra system packages.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and ./target keyed on the lockfile + toolchain.
      # cache-on-failure: a leg that fails mid-compile (slow on Windows)
      # still saves its dependency builds so the retry starts warm.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Formatting is platform-independent — checking it once is enough.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Run from the repo root so clippy.toml (the await-holding-invalid-types
      # rule) applies. Deny warnings so lint regressions fail the build.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Over TCP on purpose: the image's entrypoint runs a socket-only
      # server while it initialises and then restarts it, so a socket probe
      # can answer ready just before the real server goes down and back up.
      - name: Wait for Postgres
        if: runner.os == 'Linux'
        run: |
          for name in hubro-pg-test hubro-pg18-test; do
            ready=
            for _ in $(seq 60); do
              docker exec "$name" pg_isready -h 127.0.0.1 -U tester -d demo && { ready=1; break; }
              sleep 2
            done
            [ -n "$ready" ] || { docker logs "$name"; exit 1; }
            # In the log, so a run says which servers it actually tested.
            docker exec "$name" psql -U tester -d demo -tAc 'SELECT version()'
          done

      # Builds every target and runs the fast suite. On Linux the Postgres
      # suites run against the container above; every other engine, the SSH
      # tunnel tests, and Postgres on macOS and Windows skip because their env
      # vars are unset (no server there); the large-fixture perf tests are
      # `#[ignore]`d.
      - name: Test
        run: cargo test --all-targets

      # The same suites again, against Postgres 18. Everything is already
      # built, so this costs the suites' run time and no compile. Every
      # target rather than a list of the Postgres ones: a list would have to
      # be kept in step with which suites read HUBRO_PG_TEST_URL, and one left
      # off it would quietly lose its 18 coverage.
      - name: Test against Postgres 18
        if: runner.os == 'Linux'
        run: HUBRO_PG_TEST_URL="$PG18_URL" HUBRO_PG_TEST_MAJOR=18 cargo test --all-targets
