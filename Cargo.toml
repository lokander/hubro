[package]
name = "hubro"
version = "0.10.0"
authors = ["Fredrik Lokander <fredrik@lokander.no>"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/lokander/hubro"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls-ring", "macros", "uuid", "json"] }
# SQL Server driver. Default features are off to drop native-tls and
# Windows auth; `rustls` keeps TLS on the same rustls 0.23 sqlx uses, with no
# OpenSSL. It does turn on rustls's aws-lc-rs provider beside sqlx's ring, and
# with two providers compiled in rustls cannot pick one implicitly: a
# `ClientConfig::builder()` that names no provider panics. None of today's
# callers relies on that: sqlx always uses ring; reqwest uses an installed
# process default, else ring; tiberius uses an installed process default, else
# aws-lc-rs. `tds73` enables date/time2/datetimeoffset (SQL Server 2008+);
# `chrono` decodes them into the chrono types the rest of the app already uses.
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
# Adapts tokio's TcpStream to the futures-io traits tiberius expects.
tokio-util = { version = "0.7", features = ["compat"] }
# Same crate tiberius pulls in; direct dependency so UI code (history timestamps)
# doesn't reach for it through a driver's re-export.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# The version `toml` 0.8 already builds, so this adds no crate. Settings are
# written by editing the user's document in place rather than by serializing
# the struct over it — see `config::settings::set_settings_key`.
toml_edit = "0.20"
dirs = "7"
# dioxus-desktop depends on rfd 0.17 too, so cargo builds one copy with the
# union of both feature sets. Default features off drops `wayland`, which rfd
# only uses for `set_parent`, never called here. Linux is on the portal
# backend whatever this line says: dioxus-desktop enables `xdg-portal` on that
# shared copy, and rfd refuses `gtk3` alongside it.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
url = "2"
# preserve_order: JSON objects keep the key order they arrived in (import
# preview, json/jsonb cells, the JSON viewer) rather than sorting them; pinned
# by `a_json_preview_lists_keys_in_the_order_the_file_has_them`.
serde_json = { version = "1", features = ["preserve_order"] }
futures-util = { version = "0.3", default-features = false }
percent-encoding = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
russh = "0.64"
# Entra ID / Azure AD auth for Postgres: OAuth token HTTP, PKCE, browser launch.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.11"
# HMAC-SHA1 for hashed known_hosts entries (`|1|salt|hash`): the
# versions russh already uses for the same check.
hmac = "0.13"
sha1 = "0.11"
base64 = "0.23"
webbrowser = "1"
getrandom = "0.4"
dioxus-icons = "0.1.0"

# Credential store per OS: Secret Service / KWallet on Linux, Keychain on
# macOS, Credential Manager on Windows. The keyring API is identical across
# the three; only the backend feature differs.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
# `sync` is for the OnceCell the Postgres and SQL Server suites use to build
# their per-process database exactly once.
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "net", "sync"] }
tempfile = "3"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
