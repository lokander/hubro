[package]
name = "dataview"
version = "0.6.1"
authors = ["Fredrik Lokander <fredrik@lokander.no>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls-ring", "macros", "chrono", "uuid", "json", "rust_decimal"] }
# SQL Server driver (FRE-55). Default features are off to drop native-tls and
# Windows auth; `rustls` keeps TLS on the same rustls stack sqlx uses (tiberius
# 0.12 pins rustls 0.21 vs sqlx's 0.23, so two rustls *versions* coexist, but
# no OpenSSL). `tds73` enables date/time2/datetimeoffset (SQL Server 2008+);
# `chrono` decodes them into the chrono types the rest of the app already uses.
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
# Adapts tokio's TcpStream to the futures-io traits tiberius expects.
tokio-util = { version = "0.7", features = ["compat"] }
# Same crate sqlx pulls in; direct dependency so UI code (history timestamps)
# doesn't import chrono through sqlx's re-export.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
rfd = "0.15"
url = "2"
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
percent-encoding = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
russh = "0.62"
# Entra ID / Azure AD auth for Postgres (FRE-43): OAuth token HTTP, PKCE, browser launch.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
webbrowser = "1"
getrandom = "0.2"

# Credential store per OS: Secret Service / KWallet on Linux, Keychain on
# macOS, Credential Manager on Windows. The keyring API is identical across
# the three; only the backend feature differs.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "net"] }
tempfile = "3"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
