[package]
name = "dataview"
version = "0.1.0"
authors = ["Fredrik Lokander <fredrik@lokander.no>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls-ring", "macros"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
rfd = "0.15"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
